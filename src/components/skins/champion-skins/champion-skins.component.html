<div class="champion-skins-container">
  <h3>Skins</h3>

    <app-champion-skins-large-screen [skins]="skins" [champion]="champion" />
  } @else {
    <app-champion-skins-small-screen [skins]="skins" [champion]="champion" />
  }
</div>
